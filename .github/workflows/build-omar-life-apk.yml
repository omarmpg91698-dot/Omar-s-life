name: Build Omar's Life APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-omar-life-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build web app
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          if [ -f package-lock.json ]; then
            npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm run build

      - name: Copy built web assets into Android project
        run: |
          rm -rf android-omar-life/app/src/main/assets/www
          mkdir -p android-omar-life/app/src/main/assets/www
          cp -r dist/. android-omar-life/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: android-omar-life
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omars-Life-debug-apk
          path: android-omar-life/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omars-life-build-${{ github.run_number }}
          name: "Omar's Life (Build #${{ github.run_number }})"
          body: "Automatic Omar's Life APK build from commit ${{ github.sha }}."
          files: android-omar-life/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
